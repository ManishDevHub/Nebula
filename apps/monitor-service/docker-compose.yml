version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: monitoring-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monitoring_db
    ports:
      - "5433:5432"

  monitoring-service:
    build: .
    container_name: monitoring-service
    depends_on:
      - postgres
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/monitoring_db
    command: bun run src/api/server.ts